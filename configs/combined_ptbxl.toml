# Merge this into a BioMedCoOp+MedTsLLM configuration that already works in
# medtsllm4. The existing dataset, LLM, prompting, and BioMedCoOp sections are
# intentionally preserved.
model = "tri_medtsllm"

[models.medtsllm.combined]
q_dim = 512
q_queries = 32
q_depth = 4
q_heads = 8
dropout = 0.10

[models.medtsllm.combined.moment]
backend = "moment"
model_id = "AutonLab/MOMENT-1-base"
freeze = true
unfreeze_last_n = 0
trust_remote_code = true
allow_local_fallback = false
local_patch_size = 16
max_leads = 64
use_highres_windows = true
save_frozen_backbone = false

[models.medtsllm.combined.loss]
med_ce = 0.15
moment_ce = 0.15
query_ce = 0.10
alignment = 0.10
query_diversity = 0.01
biomedcoop = 1.0
alignment_temperature = 0.10
